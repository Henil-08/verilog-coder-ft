[project]
name = "verilog-coder-ft"
version = "0.1.0"
description = "LoRA fine-tune of a small open coder LLM for Verilog/SystemVerilog generation, with Verilator-based functional eval and MLX/vLLM inference"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
