[project]
name = "verilog-coder-ft"
version = "0.1.0"
description = "LoRA fine-tune of a small open coder LLM for Verilog/SystemVerilog generation, with Verilator-based functional eval and MLX/vLLM inference"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "jinja2>=3.1.6",
    "modal>=1.6.2",
    "pyslang>=12.0.0",
    "pyyaml>=6.0.3",
    "transformers>=4.46",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.14",
    "bitsandbytes>=0.50 ; sys_platform == 'linux'",
    "deepspeed>=0.19.6 ; sys_platform == 'linux'",
    "peft>=0.21",
    "torch>=2.13",
    "wandb>=0.30",
]
vllm = [
    "vllm==0.31.0 ; sys_platform == 'linux'",
]
mlx = [
    "mlx-lm>=0.30 ; sys_platform == 'darwin'",
]
ui = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# vLLM pins its own torch/transformers; keep it out of the training environment.
conflicts = [[{ extra = "train" }, { extra = "vllm" }]]

[tool.uv.extra-build-dependencies]
# deepspeed only ships an sdist and imports torch in setup.py
deepspeed = [{ requirement = "torch", match-runtime = true }]
