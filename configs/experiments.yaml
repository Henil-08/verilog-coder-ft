# Training runs. Each run inherits `defaults` and overrides what it lists.
#
# Ablation grid (1.5B, 20k examples): L* = LoRA, Q* = QLoRA (same adapter
# settings as the matching L* run, NF4 base), F* = full fine-tune.
# L3i tests a fix for prompt-format dependence: some training prompts describe the
# ports in prose instead of the header code block.
#
# `grid` crosses model sizes with the nine methods above on 40k examples with the
# prose-interface mix; its runs are named <size>-<method>, e.g. 3B-Q2 or 7B-F1.

defaults:
  base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  train_file: data/processed/train_20k.jsonl
  val_file: data/processed/val.jsonl
  max_seq_len: 2048
  epochs: 1
  effective_batch_size: 64
  micro_batch_size: 8
  lr_scheduler: cosine
  warmup: 0.03  # fraction of total steps
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  deepspeed: configs/deepspeed/zero2.json
  logging_steps: 5
  eval_steps: 50
  seed: 42
  gpu: H100
  n_gpus: 1
  wandb_project: verilog-coder-ft
  # Fraction of rows whose interface is given as a prose port list rather than a
  # header code block (rows with parameters/signed ports always keep the block).
  interface_prose_fraction: 0.0

lora_attn: &lora_attn
  method: lora
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

lora_all: &lora_all
  method: lora
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

runs:
  L1: {<<: *lora_attn, lora_r: 8, lora_alpha: 16, learning_rate: 2.0e-4}
  L2: {<<: *lora_all, lora_r: 16, lora_alpha: 32, learning_rate: 2.0e-4}
  L3: {<<: *lora_all, lora_r: 64, lora_alpha: 128, learning_rate: 1.0e-4}

  Q1: {<<: *lora_attn, method: qlora, lora_r: 8, lora_alpha: 16, learning_rate: 2.0e-4}
  Q2: {<<: *lora_all, method: qlora, lora_r: 16, lora_alpha: 32, learning_rate: 2.0e-4}
  Q3: {<<: *lora_all, method: qlora, lora_r: 64, lora_alpha: 128, learning_rate: 1.0e-4}

  F1: {method: full, learning_rate: 1.0e-5}
  F2: {method: full, learning_rate: 2.0e-5}
  F3: {method: full, learning_rate: 5.0e-5}

  # 0.4 of rows drawn -> ~30% actually get prose (parameterized/signed headers keep the block)
  L3i: {<<: *lora_all, lora_r: 64, lora_alpha: 128, learning_rate: 1.0e-4, interface_prose_fraction: 0.4}

  # Local CPU/MPS smoke test of the training loop; not part of the grid.
  smoke:
    <<: *lora_all
    base_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
    lora_r: 8
    lora_alpha: 16
    learning_rate: 2.0e-4
    max_seq_len: 512
    effective_batch_size: 2
    micro_batch_size: 1
    deepspeed: null
    gradient_checkpointing: false
    logging_steps: 1
    eval_steps: 2

grid:
  common:
    train_file: data/processed/train_40k.jsonl
    interface_prose_fraction: 0.4
  methods: [L1, L2, L3, Q1, Q2, Q3, F1, F2, F3]
  sizes:
    1.5B:
      base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
    3B:
      base_model: Qwen/Qwen2.5-Coder-3B-Instruct
      full:  # ~50 GB of weights/grads/Adam states: shard across two GPUs
        n_gpus: 2
        micro_batch_size: 4
    7B:
      base_model: Qwen/Qwen2.5-Coder-7B-Instruct
      micro_batch_size: 4
      full:  # ~120 GB of weights/grads/Adam states: ZeRO-3 over two H200s
        gpu: H200
        n_gpus: 2
        micro_batch_size: 2
        deepspeed: configs/deepspeed/zero3.json
